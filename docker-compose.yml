services:
  jekyll:
    image: ruby:3.3-alpine
    container_name: blog-builder
    working_dir: /site
    volumes:
      - .:/site
    command: >
      sh -c "apk add --no-cache build-base git nodejs yarn &&
             gem install bundler -v 2.6.7 &&
             bundle install &&
             bundle exec jekyll build"
    restart: "no"

  web:
    image: nginx:alpine
    container_name: blog-web-server
    ports:
      - "4007:80"
    volumes:
      - ./_site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - jekyll
    restart: always
